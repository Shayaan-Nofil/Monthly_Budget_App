name: monthly_budget_tracker
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  provider: ^6.1.5+1
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.5.1
  cunning_document_scanner: ^3.0.3
  firebase_storage: ^13.6.0
  currency_converter: ^3.0.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/budget_icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#24905C"
  adaptive_icon_foreground: assets/images/budget_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: true
  image: assets/images/budget_icon.png
  color: "#FFFFFF"
  color_dark: "#000000"
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/images/budget_icon.png
    color: "#FFFFFF"
    color_dark: "#000000"
